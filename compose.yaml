name: reflo-local

services:
  rds:
    image: postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
    environment:
      POSTGRES_DB: reflo
      POSTGRES_PASSWORD: ${REFLO_LOCAL_RDS_PASSWORD:?generated by scripts/local-stack.sh}
      POSTGRES_USER: reflo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER}",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${REFLO_LOCAL_RDS_PORT:-55432}:5432"
    stop_grace_period: 30s
    volumes:
      - rds-data:/var/lib/postgresql/data

  vector:
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: reflo_vectors
      POSTGRES_PASSWORD: ${REFLO_LOCAL_VECTOR_PASSWORD:?generated by scripts/local-stack.sh}
      POSTGRES_USER: reflo_vectors
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER}",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${REFLO_LOCAL_VECTOR_PORT:-55433}:5432"
    stop_grace_period: 30s
    volumes:
      - vector-data:/var/lib/postgresql/data

  app-setup:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      [
        "timeout",
        "180s",
        "node",
        "/opt/reflo/api/node_modules/@reflo/db/scripts/prepare-local-app-profile.mjs",
      ]
    depends_on:
      rds:
        condition: service_healthy
      vector:
        condition: service_healthy
    env_file:
      - path: ${REFLO_LOCAL_RUNTIME_ENV_FILE:?generated by scripts/local-stack.sh}
        required: false
    environment:
      DATABASE_URL: postgresql://reflo:${REFLO_LOCAL_RDS_PASSWORD:?generated by scripts/local-stack.sh}@rds:5432/reflo?sslmode=disable
      REFLO_CONNECTED_DEMO_ARTIFACT_ROOT: /var/lib/reflo/artifacts
      REFLO_LOCAL_API_RDS_PASSWORD: ${REFLO_LOCAL_API_RDS_PASSWORD:?generated by scripts/local-stack.sh}
      REFLO_ENV: dev
      REFLO_LITELLM_BASE_URL: ${REFLO_LOCAL_LITELLM_CONTAINER_BASE_URL:-http://host.docker.internal:4000}
      REFLO_VECTOR_DATABASE_URL: postgresql://reflo_vectors:${REFLO_LOCAL_VECTOR_PASSWORD:?generated by scripts/local-stack.sh}@vector:5432/reflo_vectors?sslmode=disable
    restart: "no"
    volumes:
      - app-artifacts:/var/lib/reflo/artifacts

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    depends_on:
      app-setup:
        condition: service_completed_successfully
    env_file:
      - path: ${REFLO_LOCAL_RUNTIME_ENV_FILE:?generated by scripts/local-stack.sh}
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://reflo_api:${REFLO_LOCAL_API_RDS_PASSWORD:?generated by scripts/local-stack.sh}@rds:5432/reflo?sslmode=disable
      REFLO_AUTH_CALLBACK_ORIGINS: http://127.0.0.1:${REFLO_LOCAL_WEB_PORT:-53000}
      REFLO_ACTIVATION_CHAPTER_QUIZ_DEADLINE_MS: ${REFLO_ACTIVATION_CHAPTER_QUIZ_DEADLINE_MS:-180000}
      REFLO_ACTIVATION_LESSON_DEADLINE_MS: ${REFLO_ACTIVATION_LESSON_DEADLINE_MS:-180000}
      REFLO_ACTIVATION_PLACEMENT_QUIZ_DEADLINE_MS: ${REFLO_ACTIVATION_PLACEMENT_QUIZ_DEADLINE_MS:-180000}
      REFLO_CONNECTED_DEMO_ARTIFACT_ROOT: /var/lib/reflo/artifacts
      REFLO_ENV: dev
      REFLO_LITELLM_BASE_URL: ${REFLO_LOCAL_LITELLM_CONTAINER_BASE_URL:-http://host.docker.internal:4000}
      REFLO_VECTOR_DATABASE_URL: postgresql://reflo_vectors:${REFLO_LOCAL_VECTOR_PASSWORD:?generated by scripts/local-stack.sh}@vector:5432/reflo_vectors?sslmode=disable
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    ports:
      - "127.0.0.1:${REFLO_LOCAL_API_PORT:-53001}:3001"
    stop_grace_period: 30s
    volumes:
      - app-artifacts:/var/lib/reflo/artifacts

  jobs:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/jobs/Dockerfile
      target: runtime
    depends_on:
      app-setup:
        condition: service_completed_successfully
    env_file:
      - path: ${REFLO_LOCAL_RUNTIME_ENV_FILE:?generated by scripts/local-stack.sh}
        required: false
    environment:
      JOBS_HOST: 0.0.0.0
      JOBS_PORT: 3002
      REFLO_ENV: dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    ports:
      - "127.0.0.1:${REFLO_LOCAL_JOBS_PORT:-53002}:3002"
    stop_grace_period: 30s

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_REFLO_API_ORIGIN: http://127.0.0.1:${REFLO_LOCAL_API_PORT:-53001}
        NEXT_PUBLIC_REFLO_ENV: dev
    depends_on:
      api:
        condition: service_healthy
      jobs:
        condition: service_healthy
    environment:
      REFLO_WEB_HOST: 0.0.0.0
      REFLO_WEB_PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    ports:
      - "127.0.0.1:${REFLO_LOCAL_WEB_PORT:-53000}:3000"
    stop_grace_period: 30s

volumes:
  app-artifacts:
  rds-data:
  vector-data:
